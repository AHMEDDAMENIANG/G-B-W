<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-B-W — Gestion des Commandes Grossiste</title>
    <!-- SDK Supabase requis -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #34495e;
            padding-bottom: 10px;
        }
        #loadingMessage {
            font-size: 16px;
            color: #555;
            font-style: italic;
        }
        .order-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #3498db;
        }
        .status-livree {
            border-left-color: #2ecc71;
        }
        .status-badge {
            float: right;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #e1f5fe;
            color: #0288d1;
        }
        .status-livree .status-badge {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .order-header {
            margin-bottom: 15px;
        }
        .items-list {
            background: #f8fafc;
            padding: 10px 20px;
            border-radius: 6px;
            margin: 15px 0;
        }
        .btn-deliver {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-deliver:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📦 Espace Grossiste — Suivi des Commandes</h1>
        
        <div id="loadingMessage">Chargement des commandes en cours...</div>
        <div id="ordersList"></div>
    </div>

    <script>
        // CONFIGURATION PARAMÈTRES CRITIQUES (À adapter avec vos identifiants)
        const SUPABASE_URL = "VOTRE_SUPABASE_URL";
        const SUPABASE_ANON_KEY = "VOTRE_SUPABASE_ANON_KEY";
        
        // Identifiants Meta WhatsApp Cloud API
        const WHATSAPP_TOKEN = "VOTRE_TOKEN_ACCES_PERMANENT_META"; 
        const PHONE_NUMBER_ID = "VOTRE_PHONE_NUMBER_ID_META"; 

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Simulation de la variable de session du grossiste connecté (Normalement stockée à la connexion)
        const currentVendorId = localStorage.getItem("vendorId") || "ID_GROSSISTE_TEST";

        // Redirection de sécurité si non connecté
        if (!currentVendorId || currentVendorId === "ID_GROSSISTE_TEST") {
            console.warn("Aucun identifiant de grossiste trouvé. Redirection...");
            // window.location.href = "login.html"; // Décommenter si votre page de login est prête
        }

        // 1. Récupération et affichage dynamique des commandes du grossiste
        async function loadOrders() {
            const loadingMessage = document.getElementById("loadingMessage");
            const ordersList = document.getElementById("ordersList");

            // Requête hautement sécurisée : Filtrage obligatoire par l'ID du grossiste connecté
            const { data: orders, error } = await supabase
                .from('orders')
                .select('*')
                .eq('vendor_id', currentVendorId)
                .order('created_at', { ascending: false });

            if (error) {
                loadingMessage.textContent = "Erreur de chargement : " + error.message;
                return;
            }

            if (!orders || orders.length === 0) {
                loadingMessage.textContent = "Aucune commande reçue pour le moment.";
                ordersList.innerHTML = "";
                return;
            }

            loadingMessage.style.display = "none";
            ordersList.innerHTML = "";

            orders.forEach(order => {
                const card = document.createElement("div");
                card.className = "order-card" + (order.status === "Livrée" ? " status-livree" : "");

                // Extraction et construction de la liste des articles (format JSON)
                let itemsHTML = "";
                if (order.items && Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        itemsHTML += `<li>${item.name} (x${item.quantity}) - ${item.price} FCFA</li>`;
                    });
                }

                // Calculs des parts : 5 pour 100 de commission administrative G-B-W
                const total = order.total_price || 0;
                const vendorPart = total * 0.95;
                const commissionGbw = total * 0.05;

                card.innerHTML = `
                    <div class="order-header">
                        <span><strong>Commande #${order.id.substring(0, 8)}...</strong></span>
                        <span class="status-badge">${order.status || 'En attente'}</span>
                    </div>
                    <p><strong>Client : </strong> ${order.client_name || 'Non renseigné'}</p>
                    <p><strong>Téléphone : </strong> ${order.client_phone || 'Non renseigné'}</p>
                    <p><strong>Adresse de livraison : </strong> ${order.delivery_address || 'Non renseignée'}</p>
                    
                    <div class="items-list">
                        <strong>Articles commandés :</strong>
                        <ul>${itemsHTML || '<li>Aucun article listé</li>'}</ul>
                    </div>

                    <p><strong>Montant Total : </strong><span style="color:#4CAF50; font-weight:bold;">${total} FCFA</span></p>
                    <p><strong>Votre part brute : </strong><span>${vendorPart.toFixed(0)} FCFA</span></p>
                    <p style="color:#e57373; font-size:0.9em;"><em>Commission G-B-W (5%) : ${commissionGbw.toFixed(0)} FCFA déduite</em></p>

                    ${order.status !== 'Livrée' ? `
                        <button class="btn-deliver" onclick="markAsDelivered('${order.id}')">
                            Marquer comme Livrée
                        </button>
                    ` : ''}
                `;

                ordersList.appendChild(card);
            });
        }

        // 2. Action au clic : Passage au statut "Livrée" + Interconnexion WhatsApp
        async function markAsDelivered(orderId) {
            if (!confirm("Voulez-vous vraiment marquer cette commande comme livrée ? Cela validera la commission et enverra le message WhatsApp au client.")) {
                return;
            }

            // Récupération des détails essentiels du client (Téléphone et Nom) dans Supabase
            const { data: orderData, error: fetchError } = await supabase
                .from('orders')
                .select('client_name, client_phone')
                .eq('id', orderId)
                .single();

            if (fetchError) {
                alert("Erreur technique lors de la récupération des données du client : " + fetchError.message);
                return;
            }

            // Mise à jour finale du statut dans la base de données
            const { error: updateError } = await supabase
                .from('orders')
                .update({ status: 'Livrée' })
                .eq('id', orderId);

            if (updateError) {
                alert("Erreur lors de la mise à jour : " + updateError.message);
                return;
            }

            alert("Commande mise à jour avec succès ! Le calcul des 5% de commission est effectif.");

            // Exécution technique de l'envoi de la notification Cloud de Meta
            console.log("Données prêtes pour l'API WhatsApp -> Destinataire :", orderData.client_name, "Mobile :", orderData.client_phone);

            // Payload formaté pour les gabarits (Templates) Meta Business
            const whatsappPayload = {
                messaging_product: "whatsapp",
                to: orderData.client_phone.replace(/\s+/g, ''), // Nettoie les espaces involontaires
                type: "template",
                template: {
                    name: "commande_livree", // Doit correspondre à votre template approuvé sur Meta
                    language: { code: "fr" },
                    components: [
                        {
                            type: "body",
                            parameters: [
                                { type: "text", text: orderData.client_name },
                                { type: "text", text: orderId.substring(0, 8) }
                            ]
                        }
                    ]
                }
            };

            // Requête asynchrone Fetch vers l'API Meta
            try {
                const response = await fetch(`https://facebook.com{PHONE_NUMBER_ID}/messages`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${WHATSAPP_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(whatsappPayload)
                });

                const resData = await response.json();
                if (!response.ok) throw new Error(resData.error?.message || "Erreur API Meta");
