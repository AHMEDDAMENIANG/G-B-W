<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Global Business World</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Inclusion du SDK Supabase -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="products.html">Produits</a>
        <a href="#" onclick="logout(event)">Déconnexion</a>
    </nav>

    <div class="container">
        <h1>Bienvenue sur votre tableau de bord</h1>

        <!-- Informations générales du compte -->
        <div class="card">
            <h2>Informations du compte</h2>
            <p><strong>Email : </strong><span id="userEmail">Chargement...</span></p>
            <p><strong>Type de compte : </strong><span id="userRole">Chargement...</span></p>
        </div>

        <!-- Section réservée exclusivement aux Fournisseurs (masquée par défaut) -->
        <div id="supplierSection" class="card" style="display: none; margin-top: 20px; border-top: 4px solid #4CAF50;">
            <h2>Espace Fournisseur</h2>
            <p>Gérez vos articles et suivez vos ventes sur la plateforme :</p>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <a href="add-product.html" class="btn" style="display: inline-block; padding: 10px 15px; background: #4CAF50; color: white; text-decoration: none; border-radius: 4px;">Ajouter un produit</a>
                <a href="orders.html" class="btn" style="display: inline-block; padding: 10px 15px; background: #2196F3; color: white; text-decoration: none; border-radius: 4px;">Voir les commandes</a>
            </div>
        </div>
    </div>

    <!-- Scripts de configuration et de logique -->
    <script src="supabase.js"></script>
    <script src="auth.js"></script>

    <script>
        // Vérification de la session et personnalisation de l'affichage
        async function checkUser() {
            const { data: { user }, error } = await supabase.auth.getUser();

            if (error || !user) {
                window.location.href = "login.html";
                return;
            }

            // 1. Afficher l'adresse email
            document.getElementById("userEmail").textContent = user.email;

            // 2. Récupération sécurisée du rôle depuis la base de données
            const { data: profile, error: profileError } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', user.id)
                .single();

            if (profileError || !profile) {
                console.error("Erreur de profil:", profileError);
                document.getElementById("userRole").textContent = "Erreur de chargement";
                return;
            }

            const role = profile.role;

            // 3. Personnalisation de l'affichage selon le rôle
            if (role === "supplier") {
                document.getElementById("userRole").textContent = "Fournisseur / Vendeur";
                document.getElementById("supplierSection").style.display = "block";
            } else {
                document.getElementById("userRole").textContent = "Acheteur / Client";
            }
        }

        checkUser();
    </script>
</body>
</html>
