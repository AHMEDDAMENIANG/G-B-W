<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique - Global Business World</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Styles rapides pour la grille de produits */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .product-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            background: #fff;
        }
        .product-card img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }
        .product-price {
            color: #4CAF50;
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="dashboard.html">Mon Tableau de bord</a>
        <a href="cart.html">🛒 Mon Panier</a>
    </nav>

    <div class="container">
        <h1>Nos Produits Disponibles</h1>
        
        <!-- Message de chargement ou d'erreur -->
        <div id="loadingMessage">Chargement des produits en cours...</div>

        <!-- Conteneur où les produits vont s'afficher -->
        <div id="productsGrid" class="products-grid"></div>
    </div>

    <!-- SDK et scripts de configuration -->
    <script src="https://jsdelivr.net"></script>
    <script src="supabase.js"></script>
    
    <script>
        async function loadProducts() {
            // Récupération des produits depuis la table Supabase
            const { data: products, error } = await supabase
                .from('products')
                .select('*');

            const loadingMessage = document.getElementById("loadingMessage");
            const productsGrid = document.getElementById("productsGrid");

            if (error) {
                loadingMessage.textContent = "Erreur lors du chargement : " + error.message;
                return;
            }

            if (!products || products.length === 0) {
                loadingMessage.textContent = "Aucun produit n'est disponible pour le moment.";
                return;
            }

            loadingMessage.style.display = "none";

            // Générer le HTML pour chaque produit
            products.forEach(product => {
                const productCard = document.createElement("div");
                productCard.className = "product-card";
                
                const imageUrl = product.image_url || 'https://placeholder.com';
                // Utilise le prix de vente ou le prix de base de votre table
                const displayPrice = product.selling_price || product.price;

                productCard.innerHTML = `
                    <img src="${imageUrl}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p>${product.description || 'Aucune description disponible.'}</p>
                    <div class="product-price">${displayPrice} FCFA</div>
                    <!-- Le bouton appelle maintenant la fonction de stockage panier -->
                    <button class="btn" onclick="addToCart('${product.id}', '${product.name.replace(/'/g, "\\'")}', ${displayPrice})">Ajouter au panier</button>
                `;
                
                productsGrid.appendChild(productCard);
            });
        }

        // FONCTION PANIER : Mémorise l'article localement sur le navigateur
        function addToCart(id, name, price) {
            let cart = JSON.parse(localStorage.getItem('gbw_cart')) || [];
            const existingItem = cart.find(item => item.id === id);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id: id, name: name, price: price, quantity: 1 });
            }
            
            localStorage.setItem('gbw_cart', JSON.stringify(cart));
            alert(`${name} a été ajouté à votre panier ! 🛒`);
        }

        // Lancer le chargement au démarrage de la page
        loadProducts();
    </script>
</body>
</html>
