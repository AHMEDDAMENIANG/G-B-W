<script src="supabase.js"></script>
<script>
    // 1. Sécurité : Vérifier que l'utilisateur est connecté
    async function checkAccess() {
        const { data: { user }, error } = await supabase.auth.getUser();

        if (error || !user) {
            window.location.href = "login.html";
            return null;
        }
        return user;
    }

    // 2. Envoi du produit dans Supabase lors de la soumission du formulaire
    const addProductForm = document.getElementById("addProductForm");

    addProductForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        // Vérifier l'utilisateur avant d'insérer
        const user = await checkAccess();
        if (!user) return;

        const name = document.getElementById("productName").value;
        const price = parseInt(document.getElementById("productPrice").value);
        const description = document.getElementById("productDescription").value;
        const imageUrl = document.getElementById("productImage").value;

        try {
            // Insertion dans la table 'products' avec les bonnes colonnes
            const { error } = await supabase
                .from('products')
                .insert([
                    {
                        title: name,                 // 'title' au lieu de 'name'
                        price: price,
                        description: description,
                        image_url: imageUrl,
                        supplier_id: user.id         // Relie dynamiquement le produit au grossiste connecté !
                    }
                ]);

            if (error) throw error;

            alert("Produit ajouté avec succès sur GLOBAL BUSINESS WORLD !");
            addProductForm.reset();
            window.location.href = "products.html";

        } catch (error) {
            alert("Erreur lors de l'ajout : " + error.message);
            console.error(error);
        }
    });
</script>
